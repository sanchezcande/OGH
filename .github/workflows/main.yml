name: CI/CD Pipeline

# Solo verifica que el sitio compile. El deploy lo hace Vercel desde main,
# no GitHub Pages: el repo dejó de ser una SPA estática hace rato y los pasos
# de Pages fallaban todos los días (`ls -la build` no existe en Next, que
# compila a `.next`, y tampoco hay script `deploy` en package.json).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build
