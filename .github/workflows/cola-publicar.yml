name: Publicar la cola

# Llama a /api/cola-publicar para que publique lo que Cande dejó programado, solo a mano
# (Actions > Publicar la cola > Run workflow). Ya no tiene horario (21/10): la cola la
# publica el cron de Vercel cada 15 minutos (vercel.json, en los minutos 0, 15, 30 y 45;
# CRON_SECRET en Vercel tiene el mismo valor que COLA_SECRET). GitHub no cumplía el horario:
# entre el 16 y el 21/10 corrió cada 2 a 5 horas en minutos cualquiera, y cada corrida
# despertaba la base fuera de la vuelta de los crons (ver lib/crons.js).
#
# Requiere un secreto del repo: COLA_SECRET (el mismo que está en Vercel).

on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la cola
        run: |
          # ojo: sin -L y contra www, porque curl descarta el Authorization al redirigir
          codigo=$(curl -s -o /tmp/salida.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.COLA_SECRET }}" \
            https://www.opengatehub.com/api/cola-publicar)
          echo "HTTP $codigo"
          cat /tmp/salida.json
          test "$codigo" = "200"
